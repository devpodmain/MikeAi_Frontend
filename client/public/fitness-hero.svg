<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="person-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-gradient)" rx="20"/>
  
  <!-- Person exercising -->
  <g transform="translate(80, 50)">
    <!-- Head -->
    <circle cx="120" cy="40" r="20" fill="url(#person-gradient)"/>
    
    <!-- Body -->
    <rect x="105" y="55" width="30" height="60" rx="15" fill="url(#person-gradient)"/>
    
    <!-- Arms -->
    <rect x="85" y="65" width="15" height="40" rx="7" fill="url(#person-gradient)" transform="rotate(-30 92 85)"/>
    <rect x="140" y="65" width="15" height="40" rx="7" fill="url(#person-gradient)" transform="rotate(30 147 85)"/>
    
    <!-- Legs -->
    <rect x="105" y="110" width="12" height="45" rx="6" fill="url(#person-gradient)" transform="rotate(-15 111 132)"/>
    <rect x="123" y="110" width="12" height="45" rx="6" fill="url(#person-gradient)" transform="rotate(15 129 132)"/>
    
    <!-- Dumbbells -->
    <ellipse cx="75" cy="75" rx="8" ry="4" fill="#374151"/>
    <ellipse cx="165" cy="75" rx="8" ry="4" fill="#374151"/>
    
    <!-- Connecting bars -->
    <rect x="70" y="73" width="25" height="4" fill="#6B7280"/>
    <rect x="145" y="73" width="25" height="4" fill="#6B7280"/>
  </g>
  
  <!-- Energy/motion lines -->
  <g stroke="#FBBF24" stroke-width="3" fill="none" opacity="0.8">
    <path d="M50 80 L70 85 L60 95 L75 100"/>
    <path d="M320 120 L300 125 L310 135 L295 140"/>
    <path d="M350 180 L330 185 L340 195 L325 200"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="60" cy="60" r="3" fill="#FBBF24" opacity="0.7"/>
  <circle cx="340" cy="80" r="4" fill="#10B981" opacity="0.7"/>
  <circle cx="320" cy="220" r="3" fill="#EF4444" opacity="0.7"/>
  <circle cx="80" cy="240" r="2" fill="#8B5CF6" opacity="0.7"/>
</svg>