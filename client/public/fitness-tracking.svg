<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 280" fill="none">
  <defs>
    <linearGradient id="watch-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screen-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chart-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="350" height="280" fill="#F8FAFC" rx="20"/>
  
  <!-- Fitness watch -->
  <g transform="translate(120, 80)">
    <!-- Watch band -->
    <rect x="-20" y="25" width="40" height="15" rx="7" fill="url(#watch-gradient)"/>
    <rect x="-20" y="45" width="40" height="15" rx="7" fill="url(#watch-gradient)"/>
    
    <!-- Watch face -->
    <rect x="-25" y="20" width="50" height="50" rx="10" fill="url(#watch-gradient)"/>
    
    <!-- Screen -->
    <rect x="-20" y="25" width="40" height="40" rx="5" fill="url(#screen-gradient)"/>
    
    <!-- Heart rate display -->
    <text x="0" y="35" text-anchor="middle" fill="white" font-size="8" font-weight="bold">♥ 142</text>
    <text x="0" y="45" text-anchor="middle" fill="white" font-size="6">BPM</text>
    
    <!-- Steps counter -->
    <text x="0" y="55" text-anchor="middle" fill="white" font-size="6">8,432 steps</text>
    
    <!-- Activity rings -->
    <circle cx="0" cy="40" r="15" fill="none" stroke="#374151" stroke-width="2"/>
    <circle cx="0" cy="40" r="15" fill="none" stroke="#EF4444" stroke-width="2" 
            stroke-dasharray="60 30" stroke-dashoffset="15"/>
    <circle cx="0" cy="40" r="12" fill="none" stroke="#10B981" stroke-width="2" 
            stroke-dasharray="45 30" stroke-dashoffset="10"/>
    <circle cx="0" cy="40" r="9" fill="none" stroke="#3B82F6" stroke-width="2" 
            stroke-dasharray="35 25" stroke-dashoffset="5"/>
  </g>
  
  <!-- Smartphone with fitness app -->
  <g transform="translate(220, 60)">
    <!-- Phone outline -->
    <rect x="-30" y="0" width="60" height="110" rx="15" fill="#1F2937"/>
    <rect x="-25" y="5" width="50" height="90" rx="8" fill="#000000"/>
    
    <!-- Screen content -->
    <rect x="-22" y="8" width="44" height="84" rx="5" fill="#FFFFFF"/>
    
    <!-- App header -->
    <rect x="-20" y="10" width="40" height="8" fill="#3B82F6"/>
    <text x="0" y="16" text-anchor="middle" fill="white" font-size="4" font-weight="bold">FITNESS</text>
    
    <!-- Progress chart -->
    <g transform="translate(0, 30)">
      <!-- Chart bars -->
      <rect x="-15" y="5" width="4" height="25" fill="url(#chart-gradient)"/>
      <rect x="-8" y="10" width="4" height="20" fill="url(#chart-gradient)"/>
      <rect x="-1" y="3" width="4" height="27" fill="url(#chart-gradient)"/>
      <rect x="6" y="8" width="4" height="22" fill="url(#chart-gradient)"/>
      <rect x="13" y="12" width="4" height="18" fill="url(#chart-gradient)"/>
      
      <!-- Chart labels -->
      <text x="-13" y="38" text-anchor="middle" fill="#6B7280" font-size="3">M</text>
      <text x="-6" y="38" text-anchor="middle" fill="#6B7280" font-size="3">T</text>
      <text x="1" y="38" text-anchor="middle" fill="#6B7280" font-size="3">W</text>
      <text x="8" y="38" text-anchor="middle" fill="#6B7280" font-size="3">T</text>
      <text x="15" y="38" text-anchor="middle" fill="#6B7280" font-size="3">F</text>
    </g>
    
    <!-- Stats -->
    <text x="0" y="70" text-anchor="middle" fill="#1F2937" font-size="5" font-weight="bold">Today's Goal</text>
    <text x="0" y="78" text-anchor="middle" fill="#10B981" font-size="4">85% Complete</text>
    
    <!-- Progress bar -->
    <rect x="-15" y="82" width="30" height="3" rx="1" fill="#E5E7EB"/>
    <rect x="-15" y="82" width="25" height="3" rx="1" fill="#10B981"/>
  </g>
  
  <!-- Dumbbells -->
  <g transform="translate(60, 190)">
    <ellipse cx="-20" cy="0" rx="8" ry="4" fill="#374151"/>
    <ellipse cx="20" cy="0" rx="8" ry="4" fill="#374151"/>
    <rect x="-15" y="-2" width="30" height="4" rx="2" fill="#6B7280"/>
    <circle cx="-10" cy="0" r="3" fill="#9CA3AF"/>
    <circle cx="10" cy="0" r="3" fill="#9CA3AF"/>
  </g>
  
  <!-- Protein shake -->
  <g transform="translate(280, 180)">
    <rect x="-6" y="0" width="12" height="40" rx="6" fill="#F3F4F6"/>
    <rect x="-4" y="-5" width="8" height="8" rx="2" fill="#EF4444"/>
    <ellipse cx="0" cy="25" rx="4" ry="18" fill="#FDE047" opacity="0.8"/>
    <text x="0" y="30" text-anchor="middle" fill="#1F2937" font-size="4">PRO</text>
  </g>
  
  <!-- Decorative fitness icons -->
  <g fill="#10B981" opacity="0.3">
    <circle cx="50" cy="50" r="3"/>
    <circle cx="300" cy="80" r="4"/>
    <circle cx="30" cy="120" r="2"/>
    <circle cx="320" cy="200" r="3"/>
  </g>
  
  <!-- Energy waves -->
  <g stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.4">
    <path d="M20 100 Q25 95 30 100 T40 100"/>
    <path d="M310 120 Q315 115 320 120 T330 120"/>
    <path d="M25 220 Q30 215 35 220 T45 220"/>
  </g>
</svg>